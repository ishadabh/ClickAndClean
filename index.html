<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="auth-container" id="auth-screen">
                <div style="text-align: center; margin-bottom: 25px;">
            <div class="logo" style="justify-content: center; font-size: 1.8rem;">
                <i class="fa-solid fa-recycle"></i> CleanCity Portal
            </div>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 8px;">Select portal role to access system</p>
        </div>
        
        <div class="role-selector">
            <button class="role-btn active" onclick="selectRole('user', this)"><i class="fa-solid fa-user"></i> Resident</button>
            <button class="role-btn" onclick="selectRole('admin', this)"><i class="fa-solid fa-user-shield"></i> Admin</button>
            <button class="role-btn" onclick="selectRole('driver', this)"><i class="fa-solid fa-truck"></i> Collector</button>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label id="login-label">Email or Phone Number</label>
                <input type="text" id="login-id" placeholder="user@cleancity.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" value="••••••••" required>
            </div>
            <button type="submit" class="btn" style="width: 100%; padding: 12px;">
                <i class="fa-solid fa-right-to-bracket"></i> Login to Workspace
            </button>
        </form>
    </div>
</body>
</html>
